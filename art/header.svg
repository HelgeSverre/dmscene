<title id="title">dmscene — one VM, six programs. One VM / No Sleep.</title>
<desc id="desc">The original dmscene ASCII logo in electric cyan, violet and acid green on a dark tracker grid. Pure C99. Text to byte-packed module to tracker and fractals. Same 2164 by 727 aspect ratio as fsdb.</desc>
